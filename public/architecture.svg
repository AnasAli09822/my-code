<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#090b0d"/><text x="90" y="95" fill="#f2f4f7" font-size="42" font-family="Arial" font-weight="700">Foresee architecture</text><text x="90" y="132" fill="#8f99a6" font-size="20" font-family="Arial">Intent → simulation → authorization → execution → verification → recovery</text><g font-family="Arial" font-size="18" fill="#f2f4f7" text-anchor="middle"><g transform="translate(120 230)"><rect width="180" height="74" rx="12" fill="#111418" stroke="#30373f"/><text x="90" y="45">User / Agent</text></g><g transform="translate(360 230)"><rect width="180" height="74" rx="12" fill="#111418" stroke="#30373f"/><text x="90" y="45">Intent Parser</text></g><g transform="translate(600 230)"><rect width="190" height="74" rx="12" fill="#111418" stroke="#30373f"/><text x="95" y="45">Validated DSL</text></g><g transform="translate(860 230)"><rect width="210" height="74" rx="12" fill="#111418" stroke="#30373f"/><text x="105" y="45">Simulation Engine</text></g><g transform="translate(1135 230)"><rect width="180" height="74" rx="12" fill="#111418" stroke="#30373f"/><text x="90" y="45">Human Review</text></g></g><g stroke="#59636e" stroke-width="3" fill="none"><path d="M300 267h60M540 267h60M790 267h70M1070 267h65M1225 304v116"/></g><g font-family="Arial" font-size="16" fill="#c5ccd5"><g transform="translate(805 360)"><rect width="520" height="210" rx="14" fill="#0d1013" stroke="#252b32"/><text x="30" y="42" fill="#8f99a6">SIMULATION ENGINE</text><text x="30" y="82">• Real PostgreSQL transaction</text><text x="30" y="116">• Impact graph + before/after diff</text><text x="30" y="150">• Policy + deterministic risk</text><text x="30" y="184">• Rollback planning + fingerprint</text></g><g transform="translate(365 650)"><rect width="250" height="78" rx="12" fill="#111418" stroke="#30373f"/><text x="125" y="46" text-anchor="middle" fill="#f2f4f7">Execution Gateway</text></g><g transform="translate(685 650)"><rect width="250" height="78" rx="12" fill="#111418" stroke="#30373f"/><text x="125" y="46" text-anchor="middle" fill="#f2f4f7">Runtime Safety Net</text></g><g transform="translate(1005 650)"><rect width="220" height="78" rx="12" fill="#111418" stroke="#30373f"/><text x="110" y="46" text-anchor="middle" fill="#65d39d">Commit</text></g><g transform="translate(1290 650)"><rect width="220" height="78" rx="12" fill="#111418" stroke="#59343a"/><text x="110" y="46" text-anchor="middle" fill="#ff8f8f">Rollback</text></g></g><text x="90" y="825" fill="#8f99a6" font-size="18" font-family="Arial">Simulation predicts. Policy decides. Runtime verification confirms. Rollback protects against prediction error.</text></svg>
